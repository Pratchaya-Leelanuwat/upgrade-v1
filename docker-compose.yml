services:
  db:
    image: mysql:8.4.11
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: webboard
      MYSQL_USER: webapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-app-user.sql:/docker-entrypoint-initdb.d/02-app-user.sql:ro
      - ./db:/migrations:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    ports:
      - '127.0.0.1:8080:80'
    env_file: .env
    environment:
      APP_TRUST_CF_HEADERS: "true"
    depends_on:
      db: {condition: service_healthy}
    volumes: [uploads:/var/www/private-uploads]
    networks: [backend, frontend]
    read_only: true
    tmpfs: [/tmp, /run/apache2]
    security_opt: [no-new-privileges:true]
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    profiles: ["internet-share"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://web:80"]
    depends_on:
      web: {condition: service_started}
    networks: [frontend]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    internal: true
  frontend: {}
volumes:
  db_data:
  uploads:



