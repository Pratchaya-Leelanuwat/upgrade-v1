services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: webboard
      MYSQL_USER: webapp
      MYSQL_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/02-app-user.sql:/docker-entrypoint-initdb.d/02-app-user.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    restart: unless-stopped
    ports: ["80:80"]
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
    volumes: [uploads:/var/www/private-uploads]
    networks: [backend]
    read_only: true
    tmpfs: [/tmp, /run/apache2]
    security_opt: [no-new-privileges:true]
networks:
  backend:
    internal: true
volumes:
  db_data:
  uploads:
